<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ChessCheers 自动化自检</title>
    <style>
        body { font: 13px/1.6 "SF Mono", Menlo, monospace; padding: 16px; background: #12141c; color: #dfe3ee; }
        h3 { margin: 0 0 10px; font-size: 15px; }
        .row { padding: 3px 0; }
        .pass { color: #56c98d; }
        .fail { color: #e2616c; }
        .warn { color: #f2c66a; }
        #out { margin-top: 12px; white-space: pre-wrap; background: #080a12; padding: 12px; border-radius: 8px; }
        iframe { width: 900px; height: 700px; border: 1px solid #333; border-radius: 8px; }
    </style>
</head>
<body>
    <h3>ChessCheers 自动化自检</h3>
    <div id="rows"></div>
    <pre id="out">running...</pre>
    <iframe id="frame" src="../html/game.html?wf=%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F_%E5%96%80%E5%85%B0&bf=%E9%98%BF%E8%B4%9D%E6%AF%8D%E9%B8%A1%E5%8D%A1&board=%E6%A0%87%E5%87%86&mode=pve&elo=600&side=white"></iframe>

<script>
(function () {
    'use strict';
    var results = [];
    var rows = document.getElementById('rows');
    var out = document.getElementById('out');
    var frame = document.getElementById('frame');

    function check(name, ok, detail) {
        results.push({ name: name, ok: !!ok, detail: detail || '' });
        var div = document.createElement('div');
        div.className = 'row ' + (ok ? 'pass' : 'fail');
        div.textContent = (ok ? '✅ ' : '❌ ') + name + (detail ? '  — ' + detail : '');
        rows.appendChild(div);
    }

    function dump(text) {
        out.textContent += text + '\n';
    }

    function sleep(ms) {
        return new Promise(function (r) { setTimeout(r, ms); });
    }

    // 在 iframe 内派发指针事件：down 发给棋盘元素，move/up 发给 window
    function pointer(doc, win, type, x, y) {
        var target = (type === 'pointerdown') ? doc.getElementById('board-inner') : win;
        var ev = new PointerEvent(type, {
            bubbles: true, cancelable: true, composed: true,
            clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse', isPrimary: true
        });
        target.dispatchEvent(ev);
    }

    // 取格子中心的 iframe 视口坐标
    function cellCenter(doc, square) {
        var board = doc.getElementById('board-inner');
        var rect = board.getBoundingClientRect();
        var files = 'abcdefgh';
        var ranks = '87654321';
        var col = files.indexOf(square.charAt(0));
        var row = ranks.indexOf(square.charAt(1));
        return {
            x: rect.left + (col + 0.5) * rect.width / 8,
            y: rect.top + (row + 0.5) * rect.height / 8
        };
    }

    // 玩家点击走子：from -> to
    function playMove(doc, win, from, to) {
        var a = cellCenter(doc, from);
        var b = cellCenter(doc, to);
        pointer(doc, win, 'pointerdown', a.x, a.y);
        pointer(doc, win, 'pointerup', a.x, a.y);
        pointer(doc, win, 'pointerdown', b.x, b.y);
        pointer(doc, win, 'pointerup', b.x, b.y);
    }

    function moveText(doc) {
        var list = doc.getElementById('move-list');
        return list ? list.textContent.replace(/\s+/g, ' ').trim() : '';
    }

    // 统计棋谱中的实际走法条数（按 .move-cell 非空格计数）
    function countMoves(doc) {
        var cells = doc.querySelectorAll('#move-list .move-cell');
        var n = 0;
        for (var i = 0; i < cells.length; i++) {
            if (cells[i].textContent.replace(/\s/g, '')) n++;
        }
        return n;
    }

    function run() {
        var doc = frame.contentDocument;
        var win = frame.contentWindow;

        // --- 1. 素材清单 ---
        check('素材清单已加载', !!win.CHESS_ASSETS);
        check('可用阵营 >= 2', win.CHESS_ASSETS && win.CHESS_ASSETS.camps.filter(function (c) { return c.valid; }).length >= 2);

        var bg = doc.getElementById('board-bg');
        check('棋盘背景图已设置', bg && bg.style.backgroundImage.indexOf('chessboard') >= 0,
            bg ? bg.style.backgroundImage.slice(0, 70) : '');

        // --- 2. 棋子渲染 ---
        var pieces = doc.querySelectorAll('#piece-layer .piece');
        check('棋子数量为 32', pieces.length === 32, '实际 ' + pieces.length);

        var videos = doc.querySelectorAll('#piece-layer video');
        var shown = 0;
        for (var i = 0; i < videos.length; i++) {
            if (videos[i].style.display !== 'none' && videos[i].readyState >= 2) shown++;
        }
        check('自定义素材视频已解码', shown > 0, shown + '/' + videos.length + ' 个视频就绪');

        // --- 3. 坐标标注 ---
        check('行坐标 8 项', doc.querySelectorAll('#coord-col span').length === 8);
        check('列坐标 8 项', doc.querySelectorAll('#coord-row span').length === 8);

        // --- 4. 玩家走子 e2-e4 ---
        playMove(doc, win, 'e2', 'e4');
        return sleep(1200).then(function () {
            var text = moveText(doc);
            check('玩家走子 e4 已记录', text.indexOf('e4') >= 0, text);

            var marks = doc.querySelectorAll('#mark-layer .mark-last').length;
            check('最后一手高亮出现', marks >= 2, '高亮格 ' + marks);

            // --- 5. AI 应手 ---
            var t0 = Date.now();
            var sawThinking = false;
            return waitFor(function () {
                if (doc.getElementById('thinking').className.indexOf('show') >= 0) sawThinking = true;
                var txt = moveText(doc);
                return countMoves(doc) >= 2;
            }, 30000).then(function () {
                var text2 = moveText(doc);
                var eng = win.StockfishEngine;
                dump('引擎诊断: isReady=' + eng.isReady() + ' hasFailed=' + eng.hasFailed() +
                    ' 思考提示出现=' + sawThinking + ' 用时=' + (Date.now() - t0) + 'ms');
                dump('棋谱: ' + text2);
                dump('提示: ' + doc.getElementById('toast').textContent);
                check('AI 已应手（棋谱 2 步）', countMoves(doc) >= 2, text2);
                check('引擎状态正常', eng.isReady() && !eng.hasFailed());
                finish();
            });
        });
    }

    // 轮询等待条件成立
    function waitFor(fn, timeout) {
        return new Promise(function (resolve) {
            var t0 = Date.now();
            (function loop() {
                var ok = false;
                try { ok = fn(); } catch (e) { ok = false; }
                if (ok || Date.now() - t0 > timeout) return resolve(ok);
                setTimeout(loop, 200);
            })();
        });
    }

    function finish() {
        var pass = results.filter(function (r) { return r.ok; }).length;
        dump('通过 ' + pass + '/' + results.length);
        dump('DONE');
        var title = document.createElement('div');
        title.className = 'row ' + (pass === results.length ? 'pass' : 'fail');
        title.textContent = '汇总：' + pass + '/' + results.length + ' 项通过';
        rows.appendChild(title);
    }

    frame.addEventListener('load', function () {
        out.textContent = '';
        setTimeout(function () {
            try { run(); } catch (e) { dump('EXCEPTION: ' + e.message); }
        }, 3500);   // 留出素材与引擎初始化时间
    });
})();
</script>
</body>
</html>
