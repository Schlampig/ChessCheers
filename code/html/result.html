<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ChessCheers - 结算</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/result.css?v=202611091928">
</head>
<body>
    <!-- 结算弹窗：点击按钮前不消失 -->
    <div class="result-modal" id="result-modal">
        <div class="result-content" id="result-content">
            <!-- 文本区域 -->
            <div class="result-title-section">
                <h2 class="result-title" id="result-title">对局结束</h2>
                <p class="result-subtitle" id="result-subtitle"></p>
            </div>

            <!-- 按钮区域 -->
            <div class="result-buttons" id="result-buttons">
                <button class="result-btn" id="replay-btn">再来一盘</button>
                <button class="result-btn" id="print-btn">打印</button>
                <a class="result-btn" id="confirm-btn" href="index.html">确认</a>
            </div>

            <!-- 结算素材（无素材时隐藏） -->
            <div class="result-asset" id="result-asset">
                <img class="result-asset-img" id="result-asset-img" alt="">
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/assets.js?v=202611091928"></script>
    <script src="../js/asset-loader.js?v=202611091928"></script>
    <script src="../js/result.js?v=202611091928"></script>
</body>
</html>
